name: Agent 8 TRR 1.1.3 third-wave validation

on:
  workflow_dispatch:
  push:
    branches:
      - agent8-mongosql-trr-thirdwave-20260830

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Install spreadsheet and browser tooling
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y libreoffice-calc
          python3 -m pip install --break-system-packages openpyxl beautifulsoup4
          command -v libreoffice
          command -v google-chrome

      - name: Download and identify current TRR
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p thirdwave/bin thirdwave/results/browser-dumps thirdwave/schema-out thirdwave/log-out
          curl --fail --location --retry 5 --retry-all-errors \
            https://translators-connectors-releases.s3.amazonaws.com/transition-readiness-report/AtlasSQLReadinessReport-linux \
            -o thirdwave/bin/AtlasSQLReadinessReport-linux
          chmod +x thirdwave/bin/AtlasSQLReadinessReport-linux
          sha256sum thirdwave/bin/AtlasSQLReadinessReport-linux > thirdwave/results/binary-sha256.txt
          thirdwave/bin/AtlasSQLReadinessReport-linux --version > thirdwave/results/version.txt 2>&1 || true
          thirdwave/bin/AtlasSQLReadinessReport-linux --help > thirdwave/results/help.txt 2>&1 || true

      - name: Start MongoDB and seed formula-prefix variants
        shell: bash
        run: |
          set -euxo pipefail
          docker run -d --name agent8-mongo \
            -p 127.0.0.1:27017:27017 \
            -e MONGO_INITDB_ROOT_USERNAME=trruser \
            -e MONGO_INITDB_ROOT_PASSWORD='TRR_SECRET_CANARY_7A91FD' \
            mongo:8.0
          ready=0
          for i in $(seq 1 90); do
            if docker exec agent8-mongo mongosh --quiet \
              -u trruser -p 'TRR_SECRET_CANARY_7A91FD' \
              --authenticationDatabase admin \
              --eval 'db.adminCommand({ping:1})' >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" = 1
          docker exec -i agent8-mongo mongosh --quiet \
            -u trruser -p 'TRR_SECRET_CANARY_7A91FD' \
            --authenticationDatabase admin \
            < agent8-thirdwave/seed2.js \
            > thirdwave/results/seed.log 2>&1

      - name: Generate schema reports and force authentication failure
        shell: bash
        run: |
          set +e
          timeout -k 10s 240s thirdwave/bin/AtlasSQLReadinessReport-linux \
            --uri 'mongodb://trruser:TRR_SECRET_CANARY_7A91FD@127.0.0.1:27017/admin?authSource=admin' \
            --output "$PWD/thirdwave/schema-out" \
            --include 'trrcsv.*' \
            </dev/null > thirdwave/results/schema.stdout 2> thirdwave/results/schema.stderr
          echo $? > thirdwave/results/schema.exit

          timeout -k 10s 60s thirdwave/bin/AtlasSQLReadinessReport-linux \
            --uri 'mongodb://trruser:TRR_SECRET_CANARY_7A91FD_WRONG@127.0.0.1:27017/admin?authSource=admin' \
            --output "$PWD/thirdwave/auth-out" \
            --include 'trrcsv.=1+1' \
            </dev/null > thirdwave/results/auth.stdout 2> thirdwave/results/auth.stderr
          echo $? > thirdwave/results/auth.exit
          set -e

      - name: Recover representative BI Connector log fixtures
        shell: bash
        run: |
          set -euxo pipefail
          git clone --quiet https://github.com/mongodb/mongosql.git thirdwave/old-source
          git -C thirdwave/old-source checkout --quiet 4d9ebfcd22a87595bcd9182ad9d3ec5916f71826
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          root = Path('thirdwave/old-source/bic-trip')
          candidates = []
          for p in root.rglob('*'):
              if not p.is_file() or p.stat().st_size > 5_000_000:
                  continue
              try:
                  text = p.read_text(errors='replace')
              except Exception:
                  continue
              score = 0
              low = text.lower()
              for token, weight in [('query', 5), ('mongosql', 4), ('username', 3), ('timestamp', 2), ('log', 1)]:
                  if token in low:
                      score += weight
              if p.suffix.lower() in {'.log', '.json', '.txt'}:
                  score += 3
              if 'test' in str(p).lower():
                  score += 2
              if score >= 7:
                  candidates.append((score, p))
          candidates.sort(key=lambda x: (-x[0], str(x[1])))
          marker = "<svg onload=document.documentElement.setAttribute('data-trr-log-path','EXECUTED')>"
          dest = Path('thirdwave/log-input') / marker
          dest.mkdir(parents=True, exist_ok=True)
          selected = candidates[:25]
          for index, (_, source) in enumerate(selected):
              suffix = source.suffix if source.suffix else '.log'
              shutil.copyfile(source, dest / f'fixture-{index}{suffix}')
          if selected:
              malicious_name = "\"><img src=x onerror=document.documentElement.setAttribute('data-trr-log-attr','EXECUTED')>.log"
              shutil.copyfile(selected[0][1], dest / malicious_name)
          Path('thirdwave/results/log-fixtures.txt').write_text(
              '\n'.join(f'{score} {path}' for score, path in selected)
          )
          PY

      - name: Generate log report with attacker-controlled path and filename
        shell: bash
        run: |
          set +e
          input_dir="$(find thirdwave/log-input -mindepth 1 -maxdepth 1 -type d -print -quit)"
          timeout -k 10s 180s thirdwave/bin/AtlasSQLReadinessReport-linux \
            --input "$PWD/$input_dir" \
            --output "$PWD/thirdwave/log-out" \
            </dev/null > thirdwave/results/log.stdout 2> thirdwave/results/log.stderr
          echo $? > thirdwave/results/log.exit
          set -e

      - name: Open generated log HTML in Chrome and dump resulting DOM
        shell: bash
        run: |
          set -euxo pipefail
          count=0
          while IFS= read -r -d '' report; do
            count=$((count + 1))
            profile="$(mktemp -d)"
            timeout -k 5s 30s google-chrome \
              --headless=new --no-sandbox --disable-gpu \
              --disable-background-networking --disable-component-update \
              --disable-sync --user-data-dir="$profile" \
              --virtual-time-budget=8000 --dump-dom \
              "file://$PWD/$report" \
              > "thirdwave/results/browser-dumps/report-$count.html" \
              2>> thirdwave/results/chrome.stderr || true
            rm -rf "$profile"
          done < <(find thirdwave/log-out -type f \( -iname '*.html' -o -iname '*.htm' \) -print0)

      - name: Convert controls and every TRR CSV with LibreOffice Calc
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p thirdwave/controls thirdwave/controls-converted thirdwave/converted
          python3 - <<'PY'
          from pathlib import Path
          import csv
          payloads = [
              '=1+1', '+11+11', '-12+12', '@SUM(13,13)', ' =2+2',
              '\t=3+3', '\r=4+4', '\n=5+5', '\x0b=6+6', '\x0c=7+7',
              '\u00a0=8+8', '\ufeff=9+9', '\u200b=10+10'
          ]
          with Path('thirdwave/controls/control.csv').open('w', newline='') as out:
              writer = csv.writer(out)
              for value in payloads:
                  writer.writerow([value])
          PY
          profile="$(mktemp -d)"
          timeout -k 10s 120s libreoffice \
            -env:UserInstallation="file://$profile" --headless \
            --convert-to xlsx --outdir thirdwave/controls-converted \
            thirdwave/controls/control.csv \
            > thirdwave/results/libreoffice-control.stdout \
            2> thirdwave/results/libreoffice-control.stderr || true
          rm -rf "$profile"

          index=0
          while IFS= read -r -d '' source; do
            index=$((index + 1))
            work="thirdwave/csv-import-$index"
            out="thirdwave/converted/import-$index"
            mkdir -p "$work" "$out"
            cp "$source" "$work/input.csv"
            printf '%s\n' "$source" > "$out/source-path.txt"
            profile="$(mktemp -d)"
            timeout -k 10s 120s libreoffice \
              -env:UserInstallation="file://$profile" --headless \
              --convert-to xlsx --outdir "$out" "$work/input.csv" \
              > "$out/libreoffice.stdout" 2> "$out/libreoffice.stderr" || true
            rm -rf "$profile"
          done < <(find thirdwave/schema-out thirdwave/log-out -type f -iname '*.csv' -print0)

      - name: Analyze and commit compact evidence
        if: always()
        shell: bash
        run: |
          set +e
          python3 agent8-thirdwave/analyze.py
          git config user.name agent8-validation-bot
          git config user.email agent8-validation-bot@users.noreply.github.com
          mkdir -p agent8-thirdwave-results
          cp thirdwave/results/analysis.md agent8-thirdwave-results/latest.md 2>/dev/null || true
          cp thirdwave/results/analysis.json agent8-thirdwave-results/latest.json 2>/dev/null || true
          cp thirdwave/results/version.txt agent8-thirdwave-results/version.txt 2>/dev/null || true
          cp thirdwave/results/binary-sha256.txt agent8-thirdwave-results/binary-sha256.txt 2>/dev/null || true
          cp thirdwave/results/seed.log agent8-thirdwave-results/seed.log 2>/dev/null || true
          git add agent8-thirdwave-results
          git commit -m 'test: record Agent 8 TRR third-wave results' || true
          git push origin HEAD:agent8-mongosql-trr-thirdwave-20260830 || true

      - name: Upload full third-wave evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent8-trr-thirdwave-evidence
          path: thirdwave/results
          if-no-files-found: warn
          retention-days: 7
