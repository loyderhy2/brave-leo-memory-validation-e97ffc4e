name: Agent 6 MongoDB Official Source Staging

on:
  push:
    branches:
      - agent6-mongodb-binaries-20260830
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download upstream tagged source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staged
          source_url='https://github.com/mongodb/mongo-tools/archive/refs/tags/100.18.0.tar.gz'
          curl -fsSL --retry 3 --retry-delay 2 "$source_url" -o staged/mongo-tools-100.18.0-source.tar.gz
          sha256sum staged/mongo-tools-100.18.0-source.tar.gz | tee staged/SHA256SUMS.txt
          printf '%s\n' "$source_url" > staged/SOURCES.txt

      - name: Upload tagged source
        uses: actions/upload-artifact@v4
        with:
          name: agent6-mongo-tools-100.18.0-source
          path: staged
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
