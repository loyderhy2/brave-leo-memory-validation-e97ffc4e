name: Temporary Kiwi auth single-account lifecycle validation

on:
  issues:
    types:
      - opened

permissions:
  contents: read
  issues: write

jobs:
  validate:
    if: github.event.issue.title == '[SECURITY-RESEARCH] Run Kiwi auth lifecycle'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      REPOSITORY: ${{ github.repository }}
      REPOSITORY_OWNER: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v4

      - name: Establish one-time encrypted OTP channel and request one code
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p /tmp/kiwi-auth /tmp/kiwi-evidence

          email=$(git log -1 --format=%ae)
          case "$email" in
            *@gmail.com) ;;
            *) echo 'Controlled Gmail address was not available from commit metadata' >&2; exit 1 ;;
          esac

          challenge=$(openssl rand -hex 16)
          printf '%s' "$challenge" > /tmp/kiwi-auth/challenge
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /tmp/kiwi-auth/private.pem >/dev/null 2>&1
          openssl pkey -in /tmp/kiwi-auth/private.pem -pubout -out /tmp/kiwi-auth/public.pem >/dev/null 2>&1
          public_key_b64=$(base64 -w0 /tmp/kiwi-auth/public.pem)

          cat > /tmp/kiwi-auth/channel.md <<EOF
          KIWI_OTP_ENCRYPTION_V1

          challenge: ${challenge}
          public_key_base64: ${public_key_b64}
          EOF
          gh issue comment "$ISSUE_NUMBER" --repo "$REPOSITORY" --body-file /tmp/kiwi-auth/channel.md >/dev/null

          EMAIL="$email" python3 <<'PY'
          import base64, hashlib, json, os, urllib.error, urllib.request
          from pathlib import Path

          email = os.environ['EMAIL']
          public_client = 'Basic ' + base64.b64encode(
              b'frontend:WoPHu5saC6H8yUU3lnaqPWFbKT'
          ).decode()
          payload = json.dumps({'email': email, 'brand': 'kiwicom'}).encode()
          req = urllib.request.Request(
              'https://auth.skypicker.com/v2/user/otp/request',
              data=payload,
              method='POST',
              headers={
                  'Authorization': public_client,
                  'Origin': 'https://www.kiwi.com',
                  'Referer': 'https://www.kiwi.com/',
                  'Content-Type': 'application/json',
                  'Accept': 'application/json',
                  'User-Agent': 'Mozilla/5.0 Chrome/140.0',
              },
          )
          try:
              with urllib.request.urlopen(req, timeout=30) as response:
                  status = response.status
                  raw = response.read()
          except urllib.error.HTTPError as error:
              status = error.code
              raw = error.read()
          if status != 200:
              raise SystemExit(f'OTP initiation returned HTTP {status}')
          data = json.loads(raw)
          transaction_id = data.get('transaction_id')
          if not isinstance(transaction_id, str) or not transaction_id:
              raise SystemExit('OTP initiation did not return a transaction ID')
          Path('/tmp/kiwi-auth/transaction_id').write_text(transaction_id, encoding='utf-8')
          Path('/tmp/kiwi-evidence/init.json').write_text(json.dumps({
              'status': status,
              'controlled_email_sha256': hashlib.sha256(email.encode()).hexdigest(),
              'transaction_id_sha256': hashlib.sha256(transaction_id.encode()).hexdigest(),
              'requests': 1,
          }, indent=2), encoding='utf-8')
          PY

      - name: Receive and consume encrypted OTP
        shell: bash
        run: |
          set -euo pipefail
          challenge=$(cat /tmp/kiwi-auth/challenge)
          ciphertext=''
          for _ in $(seq 1 180); do
            issue_body=$(gh issue view "$ISSUE_NUMBER" --repo "$REPOSITORY" --json body,author --jq 'select(.author.login == env.REPOSITORY_OWNER) | .body')
            case "$issue_body" in
              KIWI_OTP_CIPHERTEXT_V1:*)
                ciphertext=${issue_body#KIWI_OTP_CIPHERTEXT_V1:}
                break
                ;;
            esac
            sleep 3
          done
          if [[ -z "$ciphertext" ]]; then
            echo 'Encrypted OTP was not received' >&2
            exit 1
          fi

          printf '%s' "$ciphertext" | base64 -d > /tmp/kiwi-auth/ciphertext.bin
          openssl pkeyutl -decrypt \
            -inkey /tmp/kiwi-auth/private.pem \
            -in /tmp/kiwi-auth/ciphertext.bin \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -out /tmp/kiwi-auth/plaintext.json

          CHALLENGE="$challenge" python3 <<'PY'
          import json, os, re
          from pathlib import Path
          data = json.loads(Path('/tmp/kiwi-auth/plaintext.json').read_text(encoding='utf-8'))
          if data.get('challenge') != os.environ['CHALLENGE']:
              raise SystemExit('Encrypted payload challenge mismatch')
          otp = str(data.get('otp', ''))
          if not re.fullmatch(r'[0-9]{6,10}', otp):
              raise SystemExit('Encrypted payload did not contain a valid OTP shape')
          Path('/tmp/kiwi-auth/otp').write_text(otp, encoding='utf-8')
          PY

          gh issue edit "$ISSUE_NUMBER" --repo "$REPOSITORY" \
            --body 'Encrypted single-use payload consumed and redacted.' >/dev/null
          rm -f /tmp/kiwi-auth/ciphertext.bin /tmp/kiwi-auth/plaintext.json /tmp/kiwi-auth/public.pem /tmp/kiwi-auth/channel.md

      - name: Run bounded session lifecycle controls
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import json
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path
          from typing import Any

          auth_root = 'https://auth.skypicker.com'
          public_client = 'Basic ' + base64.b64encode(
              b'frontend:WoPHu5saC6H8yUU3lnaqPWFbKT'
          ).decode()
          transaction_id = Path('/tmp/kiwi-auth/transaction_id').read_text(encoding='utf-8')
          otp = Path('/tmp/kiwi-auth/otp').read_text(encoding='utf-8')
          last_request = 0.0
          observations: list[dict[str, Any]] = []

          def pace() -> None:
              global last_request
              delay = 1.0 - (time.monotonic() - last_request)
              if delay > 0:
                  time.sleep(delay)
              last_request = time.monotonic()

          def summarize_body(raw: bytes) -> dict[str, Any]:
              try:
                  data = json.loads(raw)
              except Exception:
                  return {'body_sha256': hashlib.sha256(raw).hexdigest(), 'body_bytes': len(raw)}
              if not isinstance(data, dict):
                  return {'json_type': type(data).__name__, 'body_sha256': hashlib.sha256(raw).hexdigest()}
              safe: dict[str, Any] = {'json_keys': sorted(data.keys())}
              for key in ('status', 'title', 'detail', 'type', 'error', 'message'):
                  value = data.get(key)
                  if isinstance(value, (str, int, float, bool)) or value is None:
                      safe[key] = value
              return safe

          def request(label: str, path: str, *, bearer: str | None = None, payload: dict[str, Any] | None = None, basic: bool = False) -> tuple[int, bytes]:
              pace()
              headers = {
                  'Origin': 'https://www.kiwi.com',
                  'Referer': 'https://www.kiwi.com/',
                  'Content-Type': 'application/json',
                  'Accept': 'application/json',
                  'User-Agent': 'Mozilla/5.0 Chrome/140.0',
              }
              if bearer is not None:
                  headers['Authorization'] = 'Bearer ' + bearer
              elif basic:
                  headers['Authorization'] = public_client
              body = json.dumps(payload or {}, separators=(',', ':')).encode()
              req = urllib.request.Request(auth_root + path, data=body, method='POST', headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      status = response.status
                      raw = response.read()
              except urllib.error.HTTPError as error:
                  status = error.code
                  raw = error.read()
              observations.append({'label': label, 'status': status, **summarize_body(raw)})
              return status, raw

          def extract_tokens(raw: bytes) -> tuple[str, str]:
              data = json.loads(raw)
              token = data.get('token') if isinstance(data, dict) else None
              if isinstance(token, dict):
                  access = token.get('access_token') or token.get('accessToken')
                  refresh = token.get('refresh_token') or token.get('refreshToken')
              else:
                  access = data.get('access_token') if isinstance(data, dict) else None
                  refresh = data.get('refresh_token') if isinstance(data, dict) else None
              if not isinstance(access, str) or not isinstance(refresh, str):
                  raise RuntimeError('Token pair was not returned')
              return access, refresh

          def token_metadata(token: str) -> dict[str, Any]:
              result: dict[str, Any] = {
                  'sha256': hashlib.sha256(token.encode()).hexdigest(),
                  'length': len(token),
              }
              parts = token.split('.')
              if len(parts) != 3:
                  return result
              try:
                  def decode(part: str) -> Any:
                      return json.loads(base64.urlsafe_b64decode(part + '=' * (-len(part) % 4)))
                  header = decode(parts[0])
                  claims = decode(parts[1])
                  result['alg'] = header.get('alg') if isinstance(header, dict) else None
                  for key in ('exp', 'iat', 'nbf'):
                      if isinstance(claims, dict) and isinstance(claims.get(key), (int, float)):
                          result[key] = claims[key]
                  if isinstance(claims, dict) and isinstance(claims.get('sub'), str):
                      result['sub_sha256'] = hashlib.sha256(claims['sub'].encode()).hexdigest()
              except Exception:
                  result['decode_error'] = True
              return result

          # Negative controls before using the real session.
          request('negative_invalid_refresh', '/v2/token/refresh', payload={'refresh_token': 'synthetic-invalid-refresh'}, basic=True)
          request('negative_invalid_access_oracle', '/v2/oidc/login', bearer='synthetic-invalid-access', payload={})

          login_status, login_raw = request(
              'control_otp_login',
              '/v2/user/otp/login',
              payload={'transaction_id': transaction_id, 'otp_code': otp},
              basic=True,
          )
          if login_status != 200:
              raise SystemExit(f'OTP login failed with HTTP {login_status}')
          access0, refresh0 = extract_tokens(login_raw)

          report: dict[str, Any] = {
              'access0': token_metadata(access0),
              'refresh0': token_metadata(refresh0),
          }

          # A completed OTP transaction should not be reusable.
          request(
              'attack_otp_transaction_replay',
              '/v2/user/otp/login',
              payload={'transaction_id': transaction_id, 'otp_code': otp},
              basic=True,
          )

          # Valid access-token oracle; empty OIDC payload performs no privileged operation.
          request('control_valid_access_oracle_before_refresh', '/v2/oidc/login', bearer=access0, payload={})

          refresh_status, refresh_raw = request(
              'control_refresh0_first_use',
              '/v2/token/refresh',
              payload={'refresh_token': refresh0},
              basic=True,
          )
          if refresh_status == 200:
              access1, refresh1 = extract_tokens(refresh_raw)
          else:
              access1, refresh1 = access0, refresh0
          report['access1'] = token_metadata(access1)
          report['refresh1'] = token_metadata(refresh1)
          report['rotation'] = {
              'access_changed': access1 != access0,
              'refresh_changed': refresh1 != refresh0,
          }

          request(
              'attack_refresh0_reuse_after_rotation',
              '/v2/token/refresh',
              payload={'refresh_token': refresh0},
              basic=True,
          )
          request('control_valid_access_oracle_before_logout', '/v2/oidc/login', bearer=access1, payload={})

          logout_status, _ = request('control_logout_current_access', '/v2/me/logout', bearer=access1, payload={})
          report['logout_status'] = logout_status

          request('attack_current_access_after_logout', '/v2/oidc/login', bearer=access1, payload={})
          if access0 != access1:
              request('attack_previous_access_after_logout', '/v2/oidc/login', bearer=access0, payload={})
          request(
              'attack_current_refresh_after_logout',
              '/v2/token/refresh',
              payload={'refresh_token': refresh1},
              basic=True,
          )
          if refresh0 != refresh1:
              request(
                  'attack_previous_refresh_after_logout',
                  '/v2/token/refresh',
                  payload={'refresh_token': refresh0},
                  basic=True,
              )
          request('negative_repeat_logout', '/v2/me/logout', bearer=access1, payload={})

          report['observations'] = observations
          report['minimum_same_host_interval_seconds'] = 1.0
          report['real_account_scope'] = 'single researcher-controlled account'
          report['bookings_accessed'] = False
          report['profile_data_stored'] = False
          report['raw_tokens_stored'] = False
          report['raw_otp_stored'] = False
          report['frontend_release'] = 'v2026-09-01_2'
          report['frontend_commit'] = '1e07488f21860c5779207fd55e755e8af72044e8'
          Path('/tmp/kiwi-evidence/lifecycle.json').write_text(json.dumps(report, indent=2), encoding='utf-8')
          PY

          rm -f /tmp/kiwi-auth/private.pem /tmp/kiwi-auth/otp /tmp/kiwi-auth/transaction_id /tmp/kiwi-auth/challenge
          sha256sum /tmp/kiwi-evidence/* > /tmp/kiwi-evidence/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kiwi-auth-lifecycle-sanitized
          path: /tmp/kiwi-evidence
          retention-days: 1
          if-no-files-found: warn
