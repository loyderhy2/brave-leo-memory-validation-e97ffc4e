name: Agent 8 TRR terminal control proof

on:
  push:
    branches:
      - agent8-mongosql-trr-20260830

permissions:
  contents: read

jobs:
  terminal-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install local terminal test dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq xterm x11-utils xclip
          command -v Xvfb
          command -v xterm
          command -v xprop
          command -v xclip

      - name: Download official TRR 1.1.3
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p evidence/bin evidence/run
          curl --fail --location --retry 5 --retry-all-errors \
            https://translators-connectors-releases.s3.amazonaws.com/transition-readiness-report/AtlasSQLReadinessReport-linux \
            -o evidence/bin/AtlasSQLReadinessReport-linux
          chmod +x evidence/bin/AtlasSQLReadinessReport-linux
          evidence/bin/AtlasSQLReadinessReport-linux --version | tee evidence/bin/version.txt
          sha256sum evidence/bin/AtlasSQLReadinessReport-linux | tee evidence/bin/sha256.txt

      - name: Seed negative control and terminal-control namespaces
        shell: bash
        run: |
          set -euxo pipefail
          docker run -d --name mongo \
            -p 127.0.0.1:27017:27017 \
            -e MONGO_INITDB_ROOT_USERNAME=trruser \
            -e MONGO_INITDB_ROOT_PASSWORD=TRR_SECRET_CANARY_7A91FD \
            mongo:8.0 --bind_ip_all

          ready=0
          for i in $(seq 1 90); do
            if docker exec mongo mongosh --quiet -u trruser -p TRR_SECRET_CANARY_7A91FD \
              --authenticationDatabase admin --eval 'db.adminCommand({ping:1})' >/dev/null 2>&1; then
              ready=1; break
            fi
            sleep 2
          done
          test "$ready" = 1

          cat > evidence/run/seed.js <<'JS'
          function create(dbName, collName) {
            const d = db.getSiblingDB(dbName);
            d.createCollection(collName);
            d.getCollection(collName).insertOne({ value: 1 });
            print(`CREATED DB=${JSON.stringify(dbName)} COLL=${JSON.stringify(collName)}`);
          }
          create("trrtermneg", "normal_collection");
          create("trrtermosc", "\u001b]0;TRR_OSC_OK\u0007");
          create("trrtermclip", "\u001b]52;c;VFJSX0NMSVBfT0s=\u0007");
          JS

          docker exec -i mongo mongosh --quiet -u trruser -p TRR_SECRET_CANARY_7A91FD \
            --authenticationDatabase admin < evidence/run/seed.js \
            2>&1 | tee evidence/run/seed.log

      - name: Run TRR in a real xterm and capture window title and clipboard
        shell: bash
        run: |
          set -euxo pipefail
          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x800x24 > evidence/run/xvfb.log 2>&1 &
          XVFB_PID=$!
          sleep 2

          export BIN="$GITHUB_WORKSPACE/evidence/bin/AtlasSQLReadinessReport-linux"
          export URI='mongodb://trruser:TRR_SECRET_CANARY_7A91FD@127.0.0.1:27017/admin?authSource=admin&directConnection=true&readPreference=primary&serverSelectionTimeoutMS=5000&connectTimeoutMS=5000'

          find_window() {
            local title="$1"
            for i in $(seq 1 100); do
              wid=$(xwininfo -root -tree 2>/dev/null | awk -v t="$title" 'index($0,t){print $1; exit}')
              if [ -n "${wid:-}" ]; then
                printf '%s' "$wid"
                return 0
              fi
              sleep 0.1
            done
            return 1
          }

          run_title_case() {
            local name="$1"
            local include="$2"
            local initial="$3"
            local trigger="/tmp/${name}.start"
            local done="/tmp/${name}.done"
            local out="$GITHUB_WORKSPACE/evidence/run/${name}"
            mkdir -p "$out/report"
            rm -f "$trigger" "$done"

            cat > "$out/runner.sh" <<SH
          #!/usr/bin/env bash
          set +e
          while [ ! -e '$trigger' ]; do sleep 0.05; done
          '$BIN' --uri '$URI' --output '$out/report' --include '$include' > '$out/tool.stdout' 2> '$out/tool.stderr'
          echo \$? > '$out/tool.status'
          touch '$done'
          sleep 12
          SH
            chmod +x "$out/runner.sh"

            xterm -geometry 160x40 -T "$initial" -e "$out/runner.sh" > "$out/xterm.stdout" 2> "$out/xterm.stderr" &
            local xpid=$!
            local wid
            wid=$(find_window "$initial")
            echo "$xpid" > "$out/xterm.pid"
            echo "$wid" > "$out/window.id"
            xprop -id "$wid" WM_NAME _NET_WM_NAME > "$out/title.before.txt" 2>&1 || true
            touch "$trigger"

            for i in $(seq 1 160); do
              xprop -id "$wid" WM_NAME _NET_WM_NAME >> "$out/title.poll.txt" 2>&1 || true
              if [ -e "$done" ]; then
                sleep 1
                xprop -id "$wid" WM_NAME _NET_WM_NAME > "$out/title.after.txt" 2>&1 || true
                break
              fi
              sleep 0.1
            done

            kill "$xpid" >/dev/null 2>&1 || true
            wait "$xpid" >/dev/null 2>&1 || true
          }

          run_title_case negative 'trrtermneg.*' 'TRR_NEGATIVE_INITIAL'
          run_title_case osc 'trrtermosc.*' 'TRR_OSC_INITIAL'

          printf 'TRR_CLIP_INITIAL' | xclip -selection clipboard
          echo "before=$(xclip -o -selection clipboard 2>/dev/null || true)" > evidence/run/clipboard.txt
          run_title_case clipboard 'trrtermclip.*' 'TRR_CLIP_INITIAL'
          echo "after=$(xclip -o -selection clipboard 2>/dev/null || true)" >> evidence/run/clipboard.txt

          kill "$XVFB_PID" >/dev/null 2>&1 || true
          wait "$XVFB_PID" >/dev/null 2>&1 || true

      - name: Validate controls and package evidence
        if: always()
        shell: bash
        run: |
          set +e
          grep -RIna --binary-files=text -E \
            'TRR_(NEGATIVE|OSC|CLIP)' evidence/run > evidence/run/all-markers.txt || true
          grep -aob 'TRR_OSC_OK' evidence/run/osc/tool.stdout > evidence/run/osc/raw-marker-offsets.txt || true
          grep -aob 'TRR_CLIP_OK' evidence/run/clipboard/tool.stdout > evidence/run/clipboard/raw-marker-offsets.txt || true
          grep -RIna --binary-files=without-match 'TRR_SECRET_CANARY_7A91FD' \
            evidence/run/negative/report evidence/run/negative/tool.stdout evidence/run/negative/tool.stderr \
            evidence/run/osc/report evidence/run/osc/tool.stdout evidence/run/osc/tool.stderr \
            evidence/run/clipboard/report evidence/run/clipboard/tool.stdout evidence/run/clipboard/tool.stderr \
            > evidence/run/tool-secret-check.txt || true

          python3 - <<'PY'
          from pathlib import Path
          out = Path('evidence/run/verdict.txt')
          neg = Path('evidence/run/negative/title.after.txt').read_text(errors='replace')
          osc = Path('evidence/run/osc/title.after.txt').read_text(errors='replace')
          clip = Path('evidence/run/clipboard.txt').read_text(errors='replace')
          out.write_text(
              'NEGATIVE_TITLE=' + repr(neg) + '\n' +
              'OSC_TITLE=' + repr(osc) + '\n' +
              'CLIPBOARD=' + repr(clip) + '\n' +
              'NEGATIVE_RETAINED=' + str('TRR_NEGATIVE_INITIAL' in neg) + '\n' +
              'OSC_TITLE_CHANGED=' + str('TRR_OSC_OK' in osc) + '\n' +
              'CLIPBOARD_CHANGED=' + str('after=TRR_CLIP_OK' in clip) + '\n',
              encoding='utf-8'
          )
          PY

          docker logs mongo > evidence/run/mongodb.stdout.txt 2> evidence/run/mongodb.stderr.txt
          tar --sort=name --mtime='UTC 2026-08-30' -czf agent8-trr-terminal-proof.tar.gz evidence
          sha256sum agent8-trr-terminal-proof.tar.gz > agent8-trr-terminal-proof.tar.gz.sha256

      - name: Upload terminal proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent8-trr-terminal-proof
          path: |
            agent8-trr-terminal-proof.tar.gz
            agent8-trr-terminal-proof.tar.gz.sha256
          retention-days: 7
          if-no-files-found: error
