name: Kiwi auth focused follow-up

on:
  push:
    branches:
      - kiwi-auth-research-20260901

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Collect focused auth evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/raw evidence/bundles
          python3 <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import json
          import re
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path
          from typing import Any

          OUT = Path("evidence")
          RAW = OUT / "raw"
          BUNDLES = OUT / "bundles"
          MIN_HOST_INTERVAL = 1.0
          MAX_BODY = 5 * 1024 * 1024
          last_request: dict[str, float] = {}
          request_log: list[dict[str, Any]] = []

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          opener = urllib.request.build_opener(NoRedirect)

          def pace(host: str) -> None:
              previous = last_request.get(host)
              if previous is not None:
                  delay = MIN_HOST_INTERVAL - (time.monotonic() - previous)
                  if delay > 0:
                      time.sleep(delay)
              last_request[host] = time.monotonic()

          def safe_name(value: str) -> str:
              return (re.sub(r"[^A-Za-z0-9._-]+", "_", value)[:180] or "response")

          def request(label: str, url: str, method: str = "GET", headers: dict[str, str] | None = None, body: bytes | None = None) -> tuple[int, dict[str, str], bytes]:
              host = (urllib.parse.urlsplit(url).hostname or "").lower()
              pace(host)
              merged = {
                  "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140.0 Safari/537.36",
                  "Accept": "application/json,text/plain,*/*",
                  "Accept-Language": "en-US,en;q=0.8",
                  "Cache-Control": "no-cache",
              }
              if headers:
                  merged.update(headers)
              req = urllib.request.Request(url, data=body, headers=merged, method=method)
              try:
                  with opener.open(req, timeout=30) as response:
                      status = int(response.status)
                      response_headers = {k.lower(): v for k, v in response.headers.items()}
                      response_body = response.read(MAX_BODY + 1)
              except urllib.error.HTTPError as error:
                  status = int(error.code)
                  response_headers = {k.lower(): v for k, v in error.headers.items()}
                  response_body = error.read(MAX_BODY + 1)
              except Exception as error:
                  status = 0
                  response_headers = {"x-client-error": f"{type(error).__name__}: {error}"}
                  response_body = b""
              if len(response_body) > MAX_BODY:
                  response_body = response_body[:MAX_BODY]
                  response_headers["x-body-truncated"] = "true"
              stem = f"{safe_name(label)}__{method.lower()}__{status}"
              (RAW / f"{stem}.headers.json").write_text(json.dumps(response_headers, indent=2, sort_keys=True), encoding="utf-8")
              (RAW / f"{stem}.body").write_bytes(response_body)
              request_log.append({
                  "label": label,
                  "url": url,
                  "method": method,
                  "status": status,
                  "request_headers": {k: ("<redacted>" if k.lower() == "authorization" else v) for k, v in merged.items()},
                  "request_body_sha256": hashlib.sha256(body or b"").hexdigest(),
                  "response_headers": response_headers,
                  "response_body_bytes": len(response_body),
                  "response_body_sha256": hashlib.sha256(response_body).hexdigest(),
              })
              return status, response_headers, response_body

          release_root = "https://www.kiwi.com/_next/static/chunks/"
          dpl = "?dpl=v2026-09-01_2"
          missing_chunks = [
              "1xqckj6i4gty8.js",
              "1n5x85q1op4bq.js",
              "1ystrt3z600_k.js",
              "0cz1d0mv5g_q7.js",
          ]
          bundle_index: list[dict[str, Any]] = []
          bundle_texts: list[tuple[str, str]] = []
          for index, name in enumerate(missing_chunks):
              url = release_root + name + dpl
              status, response_headers, response_body = request(f"bundle_{index:02d}_{name}", url)
              (BUNDLES / name).write_bytes(response_body)
              bundle_index.append({
                  "name": name,
                  "url": url,
                  "status": status,
                  "bytes": len(response_body),
                  "sha256": hashlib.sha256(response_body).hexdigest(),
                  "content_type": response_headers.get("content-type"),
              })
              bundle_texts.append((name, response_body.decode("utf-8", errors="replace")))

          cors_endpoint = "https://auth.skypicker.com/v1/user.get"
          origins = [
              ("control_www", "https://www.kiwi.com"),
              ("control_apex", "https://kiwi.com"),
              ("attack_plain", "https://attacker.invalid"),
              ("attack_suffix", "https://www.kiwi.com.attacker.invalid"),
              ("attack_prefix", "https://attacker.invalid.www.kiwi.com"),
              ("attack_userinfo", "https://www.kiwi.com@attacker.invalid"),
              ("trailing_dot", "https://www.kiwi.com."),
              ("uppercase", "https://WWW.KIWI.COM"),
              ("default_port", "https://www.kiwi.com:443"),
              ("nondefault_port", "https://www.kiwi.com:444"),
              ("http_scheme", "http://www.kiwi.com"),
              ("null_origin", "null"),
          ]
          for label, origin in origins:
              request(
                  f"cors_{label}",
                  cors_endpoint,
                  method="OPTIONS",
                  headers={
                      "Origin": origin,
                      "Access-Control-Request-Method": "POST",
                      "Access-Control-Request-Headers": "authorization,content-type",
                  },
              )

          app_basic = "Basic " + base64.b64encode(b"5433ecccaff67:").decode("ascii")
          invalid_json_requests = [
              ("user_exists_empty", "https://auth.skypicker.com/v1/user.exists"),
              ("otp_login_empty", "https://auth.skypicker.com/v1/user.otpLogin"),
              ("user_login_empty", "https://auth.skypicker.com/v1/user.login"),
              ("user_logout_empty", "https://auth.skypicker.com/v1/user.logout"),
          ]
          for label, url in invalid_json_requests:
              request(
                  label,
                  url,
                  method="POST",
                  headers={
                      "Origin": "https://www.kiwi.com",
                      "Referer": "https://www.kiwi.com/",
                      "Authorization": app_basic,
                      "Content-Type": "application/json",
                  },
                  body=b"{}",
              )

          well_known = [
              ("openid_configuration", "https://auth.skypicker.com/.well-known/openid-configuration"),
              ("jwks", "https://auth.skypicker.com/.well-known/jwks.json"),
              ("jwks_alt", "https://auth.skypicker.com/.well-known/jwks"),
          ]
          for label, url in well_known:
              request(label, url)

          terms = [
              "auth.skypicker.com", "user.", "oauth.", "login", "logout", "refresh",
              "getUserSession", "getAccessToken", "su_access_token", "su_refresh_token",
              "ua_session_token", "simpleToken", "transaction_id", "redirect_uri",
              "code_challenge", "code_verifier", "nonce", "state", "APP_ID",
          ]
          hits: list[dict[str, Any]] = []
          for source, text in bundle_texts:
              for term in terms:
                  start = 0
                  count = 0
                  while count < 50:
                      pos = text.lower().find(term.lower(), start)
                      if pos < 0:
                          break
                      hits.append({
                          "source": source,
                          "term": term,
                          "offset": pos,
                          "snippet": text[max(0, pos - 500):min(len(text), pos + len(term) + 1000)],
                      })
                      start = pos + len(term)
                      count += 1

          module_ids = ["374075", "564623", "880002", "608225"]
          modules: list[dict[str, Any]] = []
          for source, text in bundle_texts:
              for module_id in module_ids:
                  marker = module_id + ","
                  pos = text.find(marker)
                  if pos >= 0:
                      modules.append({"source": source, "module_id": module_id, "offset": pos, "snippet": text[pos:pos + 30000]})

          (OUT / "bundle_index.json").write_text(json.dumps(bundle_index, indent=2, sort_keys=True), encoding="utf-8")
          (OUT / "interesting_hits.json").write_text(json.dumps(hits, indent=2, ensure_ascii=False), encoding="utf-8")
          (OUT / "candidate_modules.json").write_text(json.dumps(modules, indent=2, ensure_ascii=False), encoding="utf-8")
          (OUT / "request_log.json").write_text(json.dumps(request_log, indent=2, ensure_ascii=False), encoding="utf-8")
          (OUT / "run_metadata.json").write_text(json.dumps({
              "generated_at_utc": __import__("datetime").datetime.now(__import__("datetime").timezone.utc).isoformat(),
              "minimum_same_host_interval_seconds": MIN_HOST_INTERVAL,
              "credentials_used": False,
              "real_email_used": False,
              "destructive_requests": False,
              "production_request_count": len(request_log),
              "release": "v2026-09-01_2",
              "frontend_commit": "1e07488f21860c5779207fd55e755e8af72044e8",
          }, indent=2), encoding="utf-8")
          PY

          find evidence -type f -print0 | sort -z | xargs -0 sha256sum > evidence/SHA256SUMS.txt

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: kiwi-auth-focused-follow-up
          path: evidence
          if-no-files-found: error
          retention-days: 7
