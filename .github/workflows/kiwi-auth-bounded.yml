name: Kiwi auth oauth-login route source

on:
  push:
    branches:
      - kiwi-auth-research-20260901

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch route-specific immutable chunk
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          curl --fail --silent --show-error --location \
            --max-time 30 \
            --user-agent 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140.0 Safari/537.36' \
            'https://static.kiwi.com/modules/one/1e07488f21860c5779207fd55e755e8af72044e8/_next/static/chunks/1vjmulnvmsrlp.js?dpl=v2026-09-01_2' \
            -D evidence/headers.txt \
            -o evidence/1vjmulnvmsrlp.js
          sha256sum evidence/1vjmulnvmsrlp.js > evidence/SHA256SUMS.txt
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          body = Path('evidence/1vjmulnvmsrlp.js').read_bytes()
          Path('evidence/metadata.json').write_text(json.dumps({
              'url': 'https://static.kiwi.com/modules/one/1e07488f21860c5779207fd55e755e8af72044e8/_next/static/chunks/1vjmulnvmsrlp.js?dpl=v2026-09-01_2',
              'bytes': len(body),
              'sha256': hashlib.sha256(body).hexdigest(),
              'release': 'v2026-09-01_2',
              'frontend_commit': '1e07488f21860c5779207fd55e755e8af72044e8',
              'same_host_request_count': 1,
              'credentials_used': False,
          }, indent=2), encoding='utf-8')
          PY
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: kiwi-auth-oauth-login-route-source
          path: evidence
          if-no-files-found: error
          retention-days: 7
