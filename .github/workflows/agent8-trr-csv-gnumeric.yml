name: Agent 8 TRR CSV spreadsheet execution validation

on:
  push:
    branches:
      - agent8-mongosql-trr-20260830

permissions:
  contents: read

jobs:
  csv-spreadsheet-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Gnumeric spreadsheet importer
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq gnumeric
          ssconvert --version | tee gnumeric-version.txt
          ssconvert --list-importers > gnumeric-importers.txt 2>&1 || true
          ssconvert --list-exporters > gnumeric-exporters.txt 2>&1 || true

      - name: Download official TRR 1.1.3
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p evidence/bin evidence/run
          mv gnumeric-version.txt gnumeric-importers.txt gnumeric-exporters.txt evidence/run/
          curl --fail --location --retry 5 --retry-all-errors \
            https://translators-connectors-releases.s3.amazonaws.com/transition-readiness-report/AtlasSQLReadinessReport-linux \
            -o evidence/bin/AtlasSQLReadinessReport-linux
          chmod +x evidence/bin/AtlasSQLReadinessReport-linux
          evidence/bin/AtlasSQLReadinessReport-linux --version | tee evidence/bin/version.txt
          sha256sum evidence/bin/AtlasSQLReadinessReport-linux | tee evidence/bin/sha256.txt

      - name: Seed formula-like collection names
        shell: bash
        run: |
          set -euxo pipefail
          docker run -d --name mongo \
            -p 127.0.0.1:27017:27017 \
            -e MONGO_INITDB_ROOT_USERNAME=operator \
            -e MONGO_INITDB_ROOT_PASSWORD=OPERATOR_SECRET_CANARY_62F1 \
            mongo:8.0 --bind_ip_all

          ready=0
          for i in $(seq 1 90); do
            if docker exec mongo mongosh --quiet \
              -u operator -p OPERATOR_SECRET_CANARY_62F1 \
              --authenticationDatabase admin \
              --eval 'db.adminCommand({ping:1})' >/dev/null 2>&1; then
              ready=1; break
            fi
            sleep 2
          done
          test "$ready" = 1

          cat > evidence/run/seed.js <<'JS'
          const d = db.getSiblingDB("trrcsvbypass");
          const names = [
            "normal_collection",
            "=40+2",
            "\t=40+3",
            "\r=40+4",
            "\n=40+5",
            "\u00a0=40+6",
            " \t=40+7",
            "+40+8",
            "-40+9",
            "@SUM(40,10)"
          ];
          for (const name of names) {
            try {
              d.createCollection(name);
              d.getCollection(name).insertOne({value: 1});
              print(`CREATED:${JSON.stringify(name)}`);
            } catch (e) {
              print(`FAILED:${JSON.stringify(name)}:${e}`);
            }
          }
          printjson(d.getCollectionNames());
          JS

          docker exec -i mongo mongosh --quiet \
            -u operator -p OPERATOR_SECRET_CANARY_62F1 \
            --authenticationDatabase admin \
            < evidence/run/seed.js 2>&1 | tee evidence/run/seed.log

      - name: Generate actual TRR CSV
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p evidence/run/report evidence/run/unpacked
          URI='mongodb://operator:OPERATOR_SECRET_CANARY_62F1@127.0.0.1:27017/admin?authSource=admin&directConnection=true&readPreference=primary&serverSelectionTimeoutMS=5000&connectTimeoutMS=5000'
          evidence/bin/AtlasSQLReadinessReport-linux \
            --uri "$URI" \
            --output "$GITHUB_WORKSPACE/evidence/run/report" \
            --include 'trrcsvbypass.*' \
            --quiet \
            > evidence/run/trr.stdout 2> evidence/run/trr.stderr
          echo $? > evidence/run/trr.status

          ZIP=$(find evidence/run/report -maxdepth 1 -type f -name '*.zip' -print -quit)
          test -n "$ZIP"
          unzip -o "$ZIP" -d evidence/run/unpacked | tee evidence/run/unzip.log
          CSV=$(find evidence/run/unpacked -type f -name '*.csv' -print -quit)
          test -n "$CSV"
          cp "$CSV" evidence/run/actual-trr.csv
          xxd -g1 evidence/run/actual-trr.csv > evidence/run/actual-trr.hex

      - name: Import actual TRR CSV in Gnumeric and inspect evaluation
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p evidence/run/gnumeric

          # Direct importer controls establish how this spreadsheet workflow treats
          # a formula at column start and the same formula after whitespace/control bytes.
          python3 - <<'PY'
          from pathlib import Path
          Path('evidence/run/gnumeric/direct-controls.csv').write_bytes(
              b'case,value\n'
              b'plain,=40+2\n'
              b'leading_tab,\t=40+3\n'
              b'leading_cr,"\r=40+4"\n'
              b'leading_space, =40+5\n'
          )
          PY

          import_one() {
            local source="$1"
            local base="$2"
            set +e
            ssconvert "$source" "evidence/run/gnumeric/${base}.gnumeric" \
              > "evidence/run/gnumeric/${base}.import.stdout" \
              2> "evidence/run/gnumeric/${base}.import.stderr"
            local istatus=$?
            set -e
            echo "$istatus" > "evidence/run/gnumeric/${base}.import.status"
            if [ "$istatus" -eq 0 ]; then
              gzip -dc "evidence/run/gnumeric/${base}.gnumeric" \
                > "evidence/run/gnumeric/${base}.gnumeric.xml" || true
              ssconvert "evidence/run/gnumeric/${base}.gnumeric" \
                "evidence/run/gnumeric/${base}.reexport.csv" \
                > "evidence/run/gnumeric/${base}.reexport.stdout" \
                2> "evidence/run/gnumeric/${base}.reexport.stderr" || true
              ssconvert "evidence/run/gnumeric/${base}.gnumeric" \
                "evidence/run/gnumeric/${base}.xlsx" \
                > "evidence/run/gnumeric/${base}.xlsx.stdout" \
                2> "evidence/run/gnumeric/${base}.xlsx.stderr" || true
              unzip -p "evidence/run/gnumeric/${base}.xlsx" xl/worksheets/sheet1.xml \
                > "evidence/run/gnumeric/${base}.xlsx.sheet1.xml" 2>/dev/null || true
              unzip -p "evidence/run/gnumeric/${base}.xlsx" xl/sharedStrings.xml \
                > "evidence/run/gnumeric/${base}.xlsx.sharedStrings.xml" 2>/dev/null || true
            fi
          }

          import_one evidence/run/gnumeric/direct-controls.csv direct-controls
          import_one evidence/run/actual-trr.csv actual-trr

      - name: Derive verdict
        if: always()
        shell: bash
        run: |
          set +e
          grep -RIna --binary-files=text -E \
            '40\+[0-9]|SUM\(40|ExprID|ValueType|<f>|<v>' \
            evidence/run/gnumeric > evidence/run/gnumeric/all-interesting.txt || true

          python3 - <<'PY'
          from pathlib import Path
          import csv, gzip, re

          root = Path('evidence/run')
          lines = []
          for rel in [
              'actual-trr.csv',
              'gnumeric/direct-controls.csv',
              'gnumeric/direct-controls.reexport.csv',
              'gnumeric/actual-trr.reexport.csv',
          ]:
              p = root / rel
              lines.append(f'===== {rel} exists={p.exists()} =====')
              if p.exists():
                  data = p.read_bytes()
                  lines.append(repr(data[:10000]))
                  try:
                      rows = list(csv.reader(data.decode('utf-8', errors='replace').splitlines()))
                      lines.append(repr(rows))
                  except Exception as exc:
                      lines.append(f'CSV_ERROR={exc!r}')

          for rel in [
              'gnumeric/direct-controls.gnumeric.xml',
              'gnumeric/actual-trr.gnumeric.xml',
              'gnumeric/direct-controls.xlsx.sheet1.xml',
              'gnumeric/actual-trr.xlsx.sheet1.xml',
          ]:
              p = root / rel
              lines.append(f'===== {rel} exists={p.exists()} =====')
              if p.exists():
                  text = p.read_text(errors='replace')
                  for match in re.finditer(r'.{0,180}(?:40\+[0-9]|SUM\(40|ExprID|<f>|<v>).{0,260}', text, re.S):
                      lines.append(match.group(0).replace('\x00', '<NUL>'))

          actual_xml = (root / 'gnumeric/actual-trr.gnumeric.xml')
          direct_xml = (root / 'gnumeric/direct-controls.gnumeric.xml')
          actual_text = actual_xml.read_text(errors='replace') if actual_xml.exists() else ''
          direct_text = direct_xml.read_text(errors='replace') if direct_xml.exists() else ''
          lines.append('DIRECT_CONTROL_FORMULA_PARSED=' + str(('40+2' in direct_text) and ('ValueType="40"' in direct_text or 'ExprID' in direct_text)))
          lines.append('ACTUAL_TRR_FORMULA_TOKEN_PRESENT=' + str(any(x in actual_text for x in ['40+2', '40+3', '40+4', '40+5', '40+6', '40+7'])))
          (root / 'gnumeric-verdict.txt').write_text('\n'.join(lines), encoding='utf-8')
          PY

          grep -RIna --binary-files=without-match 'OPERATOR_SECRET_CANARY_62F1' \
            evidence/run/report evidence/run/unpacked evidence/run/gnumeric \
            > evidence/run/generated-secret-check.txt || true
          docker logs mongo > evidence/run/mongodb.stdout 2> evidence/run/mongodb.stderr
          tar --sort=name --mtime='UTC 2026-08-30' -czf agent8-trr-csv-gnumeric-evidence.tar.gz evidence
          sha256sum agent8-trr-csv-gnumeric-evidence.tar.gz > agent8-trr-csv-gnumeric-evidence.tar.gz.sha256

      - name: Upload CSV spreadsheet evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent8-trr-csv-gnumeric-evidence
          path: |
            agent8-trr-csv-gnumeric-evidence.tar.gz
            agent8-trr-csv-gnumeric-evidence.tar.gz.sha256
          retention-days: 7
          if-no-files-found: error
